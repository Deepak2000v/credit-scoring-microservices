<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">📝</div>
      <h2>Create Account</h2>
      <p>Register as a Bank Officer</p>
    </div>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Choose a username" class="form-control" />
        <small class="error-text" *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
          Username must be at least 3 characters
        </small>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="Enter your email" class="form-control" />
        <small class="error-text" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Valid email is required
        </small>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Min 6 characters" class="form-control" />
        <small class="error-text" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Password must be at least 6 characters
        </small>
      </div>
      <div class="form-group">
        <label>Role</label>
        <select formControlName="role" class="form-control">
          <option value="ROLE_USER">Bank Officer</option>
          <option value="ROLE_ADMIN">Admin</option>
        </select>
      </div>
      <div class="alert-error" *ngIf="error">{{ error }}</div>
      <div class="alert-success" *ngIf="success">{{ success }}</div>
      <button type="submit" class="btn-primary" [disabled]="loading || registerForm.invalid">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
    </form>
    <div class="auth-footer">
      Already have an account? <a routerLink="/login">Login here</a>
    </div>
  </div>
</div>
