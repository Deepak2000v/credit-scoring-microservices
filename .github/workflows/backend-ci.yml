name: Backend CI Pipeline

on:
  push:
    branches:
      - develop
      - main
      - feature/dockerhub-ci

  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # =========================
      # USER MANAGEMENT SERVICE
      # =========================

      - name: Build User Management Service
        working-directory: backend/user-management-service
        run: mvn clean install -DskipTests

      - name: Build Docker Image - User Management
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-management-service:latest ./backend/user-management-service

      # =========================
      # CREDIT SCORING SERVICE
      # =========================

      - name: Build Credit Scoring Service
        working-directory: backend/credit-scoring-service
        run: mvn clean install -DskipTests

      - name: Build Docker Image - Credit Scoring
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/credit-scoring-service:latest ./backend/credit-scoring-service

      # =========================
      # API GATEWAY
      # =========================

      - name: Build API Gateway
        working-directory: backend/api-gateway
        run: mvn clean install -DskipTests

      - name: Build Docker Image - API Gateway
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest ./backend/api-gateway

      # =========================
      # LOGIN TO DOCKER HUB
      # =========================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # =========================
      # PUSH IMAGES
      # =========================

      - name: Push User Management Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-management-service:latest

      - name: Push Credit Scoring Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/credit-scoring-service:latest

      - name: Push API Gateway Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest